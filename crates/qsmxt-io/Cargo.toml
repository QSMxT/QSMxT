[package]
name = "qsmxt-io"
version.workspace = true
edition = "2021"
description = "QSMxT's file side: BIDS discovery and derivatives, DICOM and NIfTI, the run's file store and provenance, figures, example data and the local and SLURM executors"
license = "GPL-3.0-only"
# The qsmxt binary's build script: the QSM.rs commit from Cargo.lock and the QSMxT commit, which
# provenance records.
build = "../../build.rs"

[dependencies]
# Pinned once, in the root Cargo.toml's [workspace.dependencies].
qsm-core = { workspace = true, features = ["parallel"] }
qsmxt-engine = { path = "../qsmxt-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
glob = "0.3"
regex = "1"
log = "0.4"
thiserror = "2"
indicatif = "0.17"
chrono = "0.4"
dicom = "0.9"
nifti = "0.17"
# Copies a gzipped NIfTI to an uncompressed name (and back) as the name says (pipeline::runner).
flate2 = "1"
tempfile = "3"
toml = "0.8"
ureq = "2"
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib"] }
# Per-structure figures. Glyph rasterisation + PNG encoding only: the marks are axis-aligned
# rectangles and lines, which is not worth a 2D graphics stack. Five crates and ~270 KB, against
# ~40 crates for an SVG renderer (which also drags in JPEG/GIF/WebP decoders and font discovery).
fontdue = "0.9"
png = "0.17"

[features]
# Deep-learning weight download and inference (the binary's `dl`). Off here, so this crate's own
# tests build without the ONNX engine; the binary turns it on.
dl = ["qsm-core/onnx", "qsm-core/download", "qsmxt-engine/onnx"]
# The synthetic data generators (`testutils`) for the binary's tests.
testutils = []
