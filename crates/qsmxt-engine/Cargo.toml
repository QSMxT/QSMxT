[package]
name = "qsmxt-engine"
version = "0.0.0"  # set automatically by release CI from git tag
edition = "2021"
description = "QSMxT's run engine: pipeline configuration, command generation and methods text, without file I/O"
license = "GPL-3.0-only"

[dependencies]
# See the note in the root Cargo.toml. Must match the root pin exactly.
qsm-core = { git = "https://github.com/astewartau/QSM.rs.git", rev = "ca9df3bb111197a855035976a8ef8768516ae7d4" }
serde = { version = "1", features = ["derive"] }
# preserve_order: the methods text lists changed settings in struct order.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = "0.8"
thiserror = "2"
log = "0.4"

# qsm-core's `onnx` (tract) pulls in getrandom 0.4, which needs its `wasm_js` backend to compile
# for wasm32-unknown-unknown. Enabled with our `onnx` feature, so a WASM consumer needs nothing else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[features]
# Forwarded qsm-core features, so a consumer that depends on qsmxt-engine alone (qsmbly's WASM
# crate, via the `qsm_core` re-export) can switch them on without its own qsm-core pin. All off
# by default; the qsmxt binary enables what it needs on its own qsm-core dependency.
simd = ["qsm-core/simd"]
onnx = ["qsm-core/onnx", "dep:getrandom"]
parallel = ["qsm-core/parallel"]
# Enables qsm-core's Serialize derives so the param-coverage test can introspect
# every *Params field. Test-only; not enabled by normal/release builds.
introspection = ["qsm-core/introspection"]
