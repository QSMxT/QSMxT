description = ""

[pipeline]
do_qsm = true
do_swi = false
do_smwi = false
do_segmentation = false
do_analysis = false
do_t2starmap = false
do_r2starmap = false
do_r2map = false
do_r2primemap = false
do_chi_separation = false
export_dicom = false
axial_resampling = false
obliquity_threshold = 10.0
crop_to_mask = false
fft_padding = false
crop_margin_mm = 32.0
output_space = "acquired"
ignore_slice_gap = false

[field_mapping]
phase_offset_removal = true
phase_offset_sigma = [
    4.0,
    4.0,
    4.0,
]
coil_combination_sigma = [
    10.0,
    10.0,
    5.0,
]
bipolar_correction = false
unwrapping_algorithm = "romeo"
b0_estimation = "weighted-avg"
b0_weight_type = "phase-snr"
b0_weight_assumed_t2star_ms = 40.0
laplacian_solver = "dct"
laplacian_fft_pad = [
    64,
    64,
    64,
]

[field_mapping.romeo]
individual = true
correct_global = true
template = 0
phase_coherence = true
phase_gradient_coherence = true
phase_linearity = true
mag_coherence = true
mag_weight = false
mag_weight2 = false
bestpath = false
temporal_uncertain_unwrapping = 0.5
max_seeds = 1
merge_regions = false
correct_regions = false
wrap_addition = 0.0

[field_mapping.linear_fit]
estimate_offset = true
reliability_threshold_percentile = 90.0

[field_mapping.robust_fit]
loss = "tukey"
iterations = 3
downweight_level = 0.75
flag_ratio = 3.0

[masking]
inhomogeneity_correction = true
combine = "or"
refinements = []
two_pass = false

[[masking.sections]]
input = "phase-quality"

[masking.sections.generator]
op = "threshold"
method = "otsu"

[[masking.sections.refinements]]
op = "dilate"
iterations = 1

[[masking.sections.refinements]]
op = "fill-holes"
max_size = 0

[[masking.sections.refinements]]
op = "erode"
iterations = 1

[bg_removal]
algorithm = "vsharp"
msmv_refine = false

[bg_removal.vsharp]
deconvolve = false
threshold = 0.2
max_radius = 12.0
min_radius = 1.0
grid = "native"
grid_spacing = 1.0

[bg_removal.pdf]
tol = 0.00001

[bg_removal.lbv]
tol = 0.000001

[bg_removal.ismv]
tol = 0.000001
max_iter = 50
radius = 5.0

[bg_removal.sharp]
threshold = 0.05
radius = 6.0

[bg_removal.resharp]
radius = 6.0
tik_reg = 0.0001
tol = 0.000001
max_iter = 30

[bg_removal.harperella]
radius = 10.0
max_iter = 40
tol = 0.000001

[bg_removal.iharperella]
max_iter = 40
tol = 0.000001

[bg_removal.msmv]
radius = 5.0
maxk = 5

[inversion]
algorithm = "ilsqr"

[inversion.rts]
delta = 0.15
mu = 100000.0
rho = 10.0
tol = 0.01
max_iter = 20
lsmr_iter = 4

[inversion.tv]
lambda = 0.0002
rho = 0.02
tol = 0.001
