dr_neg = 137.0
lambda1 = 1.0
percentage = 0.9
r2p_min = 1.0
r2p_max = 30.0
max_iter = 30
tol = 0.01
cg_max_iter = 30
cg_tol = 0.05

[separation.chi_sep_medi]
