muh = 3.0
max_iter = 300
tol_update = 0.1
tol_delta = 0.000001
phase_scale = 1.0

[inversion.hdqsm]
alpha_l2 = 0.0001
mu1_l2 = 0.01
mu2 = 1.0
max_iter_l1 = 20
max_iter_l2 = 80
tol_update = 1.0

[inversion.amp_pe]
wave_order = 1
nlevel = 3
wave_pec = 0.85
simulated_te = 0.008
max_linearization_ite = 25
b0 = 3.0
gyro_ratio = 42.58
damp_rate_sig = 0.01
damp_rate_par = 0.1
max_pe_spar_ite = 5
max_pe_est_ite = 5
cvg_thd = 0.000001
tikhonov_beta = 0.02

[inversion.lsqr]
