[package]
name = "qsmxt-config"
version = "0.0.0"  # set automatically by release CI from git tag
edition = "2021"
description = "Pipeline configuration, command generation, and methods text for QSMxT"
license = "GPL-3.0-only"

[dependencies]
# TEMP: see the note in the root Cargo.toml. Must match the root pin exactly.
qsm-core = { git = "https://github.com/astewartau/QSM.rs.git", rev = "42ab620190ad315c9dcf7aa8ec4a036402002b7e" }
serde = { version = "1", features = ["derive"] }
# preserve_order: the methods text lists changed settings in struct order.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2"

[features]
# Enables qsm-core's Serialize derives so the param-coverage test can introspect
# every *Params field. Test-only; not enabled by normal/release builds.
introspection = ["qsm-core/introspection"]
