[package]
name = "qsmxt-config"
version = "0.0.0"  # set automatically by release CI from git tag
edition = "2021"
description = "Pipeline configuration, command generation, and methods text for QSMxT"
license = "GPL-3.0-only"

[dependencies]
# TEMPORARY: local path while the two-pass primitives are unreleased. Must stay in step with
# the workspace root's pin — a mismatch silently builds two copies of qsm-core.
qsm-core = { path = "/home/ashley/repos/qsm/QSM.rs-two-pass" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[features]
# Enables qsm-core's Serialize derives so the param-coverage test can introspect
# every *Params field. Test-only; not enabled by normal/release builds.
introspection = ["qsm-core/introspection"]
