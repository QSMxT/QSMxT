[workspace]
members = [".", "crates/qsmxt-engine", "crates/qsmxt-io", "crates/qsmxt-tui"]

# The release workflow sets every `version = ` line here from the tag: the binary's and this one,
# which qsmxt-io takes (its provenance and state files record it).
[workspace.package]
version = "0.0.0"  # set automatically by release CI from git tag

[workspace.dependencies]
# The one QSM.rs pin every crate uses: a QSM.rs release tag for a release, a QSM.rs main commit
# (rev) between releases. qsmbly pins qsmxt-engine, so it resolves the same qsm-core.
# tests/qsm_core_pin.rs checks it against Cargo.lock.
qsm-core = { git = "https://github.com/astewartau/QSM.rs.git", rev = "74e4bdc0a299054e566d3ecd49bfaa8a4c97ee53" }

[package]
name = "qsmxt"
version = "0.0.0"  # set automatically by release CI from git tag
edition = "2021"
description = "QSMxT: Quantitative Susceptibility Mapping processing tool"
license = "GPL-3.0-only"
repository = "https://github.com/QSMxT/QSMxT"

[[bin]]
name = "qsmxt"
path = "src/main.rs"

[features]
# Deep-learning models (ONNX inference + weight download). On by default. Disable with
# --no-default-features to build for targets where the ONNX engine can't compile (e.g.
# aarch64-pc-windows-msvc, where tract-linalg's ARM64 assembly won't build under MSVC);
# such a build keeps all classical algorithms and reports a clear error if a DL algorithm
# is selected.
default = ["dl"]
dl = ["qsm-core/onnx", "qsm-core/download", "qsmxt-engine/onnx", "qsmxt-io/dl"]

[dependencies]
# Pinned once, in [workspace.dependencies].
qsm-core = { workspace = true, features = ["parallel"] }
qsmxt-engine = { path = "crates/qsmxt-engine" }
qsmxt-io = { path = "crates/qsmxt-io" }
qsmxt-tui = { path = "crates/qsmxt-tui" }
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glob = "0.3"
# std::fs with the path in every error (`--config typo.toml` names the file it could not read).
fs-err = "3"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"
tempfile = "3"
ureq = "2"

[dev-dependencies]
qsmxt-io = { path = "crates/qsmxt-io", features = ["testutils"] }
qsmxt-tui = { path = "crates/qsmxt-tui", features = ["testutils"] }
chrono = "0.4"
sha2 = "0.10"
toml = "0.8"

# Tests that pass data through qsm-core run its numerical code, which is about ten times slower
# unoptimised (qsmxt-engine's tests took 195 s at opt-level 0, 18 s at 3, under coverage), so
# dependencies are optimised in dev and test builds. The workspace crates stay unoptimised, so they
# still build quickly and their coverage maps one-to-one onto the source (cargo-llvm-cov
# instruments only them). Release builds are unaffected.
#
# Debug info is most of a debug build's size and much of its link time. The workspace crates keep
# line tables, so backtraces and panics still name file and line; dependencies keep none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
