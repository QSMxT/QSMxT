[workspace]
members = [".", "crates/qsmxt-config"]

[package]
name = "qsmxt"
version = "0.0.0"  # set automatically by release CI from git tag
edition = "2021"
description = "QSMxT: Quantitative Susceptibility Mapping processing tool"
license = "GPL-3.0-only"
repository = "https://github.com/QSMxT/QSMxT"

[[bin]]
name = "qsmxt"
path = "src/main.rs"

[features]
# Deep-learning models (ONNX inference + weight download). On by default. Disable with
# --no-default-features to build for targets where the ONNX engine can't compile (e.g.
# aarch64-pc-windows-msvc, where tract-linalg's ARM64 assembly won't build under MSVC);
# such a build keeps all classical algorithms and reports a clear error if a DL algorithm
# is selected.
default = ["dl"]
dl = ["qsm-core/onnx", "qsm-core/download"]

[dependencies]
# TEMP: pinned to the COSMOS/STI merge (QSM.rs#115), one commit past v0.38.0 and not yet in a
# release. A `rev` pin is what CI can actually resolve — a `path` pin cannot — but it must become
# a `tag` pin before merging, or qsmbly (which pins qsmxt-config) has no release to match.
# qsmxt-config must move in lockstep.
qsm-core = { git = "https://github.com/astewartau/QSM.rs.git", rev = "fc677f977f7cff8cdb62661b9b676139456d73ae", features = ["parallel"] }
qsmxt-config = { path = "crates/qsmxt-config" }
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
glob = "0.3"
regex = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
indicatif = "0.17"
chrono = "0.4"
dicom = "0.9"
nifti = "0.17"
ratatui = "0.29"
crossterm = "0.28"
tempfile = "3"
ureq = "2"
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib"] }
# Per-structure figures. Glyph rasterisation + PNG encoding only: the marks are axis-aligned
# rectangles and lines, which is not worth a 2D graphics stack. Five crates and ~270 KB, against
# ~40 crates for an SVG renderer (which also drags in JPEG/GIF/WebP decoders and font discovery).
fontdue = "0.9"
png = "0.17"

[dev-dependencies]
tempfile = "3"
