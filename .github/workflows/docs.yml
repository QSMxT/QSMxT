name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # Pull requests build the site (which fails on a broken internal link or #heading,
  # starlight-links-validator) but don't deploy it.
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy. A pull request's newer build
# replaces its older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      # The 8.x (Python) docs are served under /v8/ — see docs/legacy/build.sh.
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          ref: python-legacy
          path: legacy-src
          sparse-checkout: docs
      - uses: ruby/setup-ruby@v1
        if: github.event_name != 'pull_request'
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: docs/legacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: legacy/build.sh "$GITHUB_WORKSPACE/legacy-src" dist/v8
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
