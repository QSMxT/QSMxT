name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering this to `main` meant a PR stacked on
  # another feature branch reported no checks at all — not a red X, just silence, which is worse
  # than a failure because nothing says the code was never tested. Pushes stay `main`-only, so a
  # feature branch is still built once (as its PR) rather than twice.
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, and the tests run once. Coverage used to be a separate job that re-ran the whole
  # suite under cargo-tarpaulin with `--test-threads=1` (~8 min) next to the plain `cargo test`
  # (~2 min). cargo-llvm-cov runs the suite in parallel, instrumented, and exits non-zero on a
  # failing test, so the one run is both the test gate and the coverage measurement.
  check:
    name: Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test --workspace` under coverage instrumentation (doctests excluded; there are
      # none). The ignore regex keeps the same files out of the report that tarpaulin's
      # --exclude-files did: entry point, TUI rendering, self-update. It only affects the
      # report; those files' tests still run.
      - name: Run tests with coverage
        run: >
          cargo llvm-cov --workspace --lcov --output-path target/lcov.info
          --ignore-filename-regex '(^|/)src/(main|tui/mod|tui/ui|commands/update)\.rs$'

      # Fails if a qsm-core *Params field isn't represented in its qsmxt-config
      # *Config wrapper (drift guard). See crates/qsmxt-config/tests/param_coverage.rs.
      - name: Param coverage (qsmxt-config vs qsm-core)
        run: cargo test -p qsmxt-config --features introspection --test param_coverage

      # Two thresholds, deliberately. 70% is the gate `release.yml` enforces, so failing here is
      # what stops a PR discovering at release time that it cannot ship. 90% is the target, and
      # stays advisory. Before this, both branches of the check ended in `echo`, so the step always
      # exited 0 — a green tick said nothing at all about coverage.
      #
      # The figure is LLVM line coverage of non-test code: every `#[cfg(test)]` item is dropped
      # from the denominator (.github/scripts/coverage_summary.py), as tarpaulin did. The two
      # tools count "coverable line" differently, so it is close to the old figure, not equal.
      - name: Check coverage threshold
        run: |
          SUMMARY=$(python3 .github/scripts/coverage_summary.py target/lcov.info)
          read -r COVERAGE COVERED COVERABLE <<< "$SUMMARY"
          echo "Coverage: ${COVERAGE}% (${COVERED}/${COVERABLE} lines)"
          if ! python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 70.0 else 1)"; then
            echo "::error::Coverage ${COVERAGE}% is below the 70% gate enforced by the release workflow"
            exit 1
          fi
          if python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 90.0 else 1)"; then
            echo "::notice::Coverage ${COVERAGE}% meets the 90% target"
          else
            echo "::warning::Coverage ${COVERAGE}% is below the 90% target (release gate is 70%)"
          fi

  # qsmbly builds qsmxt-config (and, through its `qsm_core` re-export, qsm-core) for the browser.
  # Keep it WebAssembly-buildable: classical only, and with the deep-learning engine. The `onnx`
  # build needs SIMD128, as qsmbly's does (qsm-core refuses to compile wasm `onnx` without it).
  wasm:
    name: WebAssembly check (qsmxt-config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check (classical)
        run: cargo check -p qsmxt-config --target wasm32-unknown-unknown --features simd

      - name: Check (with ONNX)
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: cargo check -p qsmxt-config --target wasm32-unknown-unknown --features simd,onnx

  # The derivatives of a run that makes every output QSMxT names have to pass the BIDS validator
  # with only the documented `.bidsignore` entries (#275). The fixture (an ignored test) writes
  # one derivatives dataset per case — a full multi-echo run, per-coil data, COSMOS, STI and an
  # oblique run left on its working grid — and each is validated as it stands.
  bids-validator:
    name: BIDS validator (derivatives)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write a full-feature run's derivatives
        run: >
          QSMXT_BIDS_FIXTURE_OUT="$RUNNER_TEMP/bids"
          cargo test --bin qsmxt -- --ignored --exact commands::integration_tests::bids_validator_fixture

      - name: Validate them
        run: |
          status=0
          for d in "$RUNNER_TEMP"/bids/*/derivatives/qsmxt; do
            echo "::group::$d"
            deno run -A jsr:@bids/validator@3.0.2 "$d" || status=1
            echo "::endgroup::"
          done
          exit $status
