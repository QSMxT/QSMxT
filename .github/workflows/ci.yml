name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering this to `main` meant a PR stacked on
  # another feature branch reported no checks at all — not a red X, just silence, which is worse
  # than a failure because nothing says the code was never tested. Pushes stay `main`-only, so a
  # feature branch is still built once (as its PR) rather than twice.
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # Fails if a qsm-core *Params field isn't represented in its qsmxt-config
      # *Config wrapper (drift guard). See crates/qsmxt-config/tests/param_coverage.rs.
      - name: Param coverage (qsmxt-config vs qsm-core)
        run: cargo test -p qsmxt-config --features introspection --test param_coverage

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage
        # --engine llvm (source-based): ptrace engine crashes on subprocess-spawning tests.
        # --timeout: tarpaulin waits 60s by default for a test to respond, and the instrumented
        # single-echo TGV run sits right on that line — it passed on qsm-core v0.35.0 and times out
        # on v0.36.0. The test is slow, not hung (the uninstrumented suite finishes in under two
        # minutes), so the budget is the thing that was wrong.
        run: cargo tarpaulin --timeout 300 --engine llvm --workspace --out json --output-dir target/tarpaulin --exclude-files src/main.rs --exclude-files src/tui/mod.rs --exclude-files src/tui/ui.rs --exclude-files src/commands/update.rs -- --test-threads=1

      # Two thresholds, deliberately. 70% is the gate `release.yml` enforces, so failing here is
      # what stops a PR discovering at release time that it cannot ship. 90% is the target, and
      # stays advisory. Before this, both branches of the check ended in `echo`, so the step always
      # exited 0 — a green tick said nothing at all about coverage.
      - name: Check coverage threshold
        run: |
          COVERAGE=$(python3 -c "import json; data=json.load(open('target/tarpaulin/tarpaulin-report.json')); print(f\"{data['coverage']:.2f}\")")
          echo "Coverage: ${COVERAGE}%"
          if ! python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 70.0 else 1)"; then
            echo "::error::Coverage ${COVERAGE}% is below the 70% gate enforced by the release workflow"
            exit 1
          fi
          if python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 90.0 else 1)"; then
            echo "::notice::Coverage ${COVERAGE}% meets the 90% target"
          else
            echo "::warning::Coverage ${COVERAGE}% is below the 90% target (release gate is 70%)"
          fi
